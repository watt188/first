name: v6-production-baseline

on:
  pull_request:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V6.0 production baseline
        run: python -m compileall production_baseline
      - name: Run V6.0 unit tests
        run: python -m unittest discover -s tests -p 'test_v60_*.py' -v
