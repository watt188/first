name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile production modules
        run: |
          python -m compileall production_baseline production_runtime side_effect_governance release_manager release_candidate multi_agent_delivery governed_model_loop protected_delivery
      - name: Baseline smoke test
        run: |
          python - <<'PY'
          from production_baseline.profile_v60 import ProductionProfileV60
          p=ProductionProfileV60()
          assert p.runtime_version == '6.0'
          assert p.side_effect_policy == 'default-deny'
          print('V6.0 baseline smoke test passed')
          PY
      - name: V8.1 protected autonomous delivery gate
        run: python -m pytest -q tests/test_protected_delivery_v81.py
      - name: V8.2 autonomous recovery gate
        run: python -m pytest -q tests/test_recovery_v82.py
      - name: V8.3 recovery action bridge gate
        run: python -m pytest -q tests/test_recovery_action_v83.py
      - name: V8.4 live recovery orchestrator gate
        run: python -m pytest -q tests/test_recovery_orchestrator_v84.py
      - name: V8.5 recovery evidence ledger gate
        run: python -m pytest -q tests/test_recovery_evidence_v85.py
      - name: V8.6 recovery state reconciliation gate
        run: python -m pytest -q tests/test_recovery_reconcile_v86.py
      - name: V8.7 recovery session coordinator gate
        run: python -m pytest -q tests/test_recovery_session_v87.py
      - name: V8.8 recovery replay guard gate
        run: python -m pytest -q tests/test_recovery_replay_v88.py
      - name: V8.9 recovery lease guard gate
        run: python -m pytest -q tests/test_recovery_lease_v89.py
      - name: V9.0 durable recovery state gate
        run: python -m pytest -q tests/test_recovery_state_v90.py
      - name: V9.1 SQLite recovery state gate
        run: python -m pytest -q tests/test_recovery_state_sqlite_v91.py
      - name: V9.2 recovery transaction engine gate
        run: python -m pytest -q tests/test_recovery_transaction_v92.py
      - name: V9.3 pending action journal gate
        run: python -m pytest -q tests/test_recovery_pending_v93.py
      - name: V9.4 journaled recovery executor gate
        run: python -m pytest -q tests/test_recovery_journaled_v94.py
      - name: V9.5 idempotent recovery gateway gate
        run: python -m pytest -q tests/test_recovery_idempotent_v95.py
      - name: V9.6 idempotent recovery transaction gate
        run: python -m pytest -q tests/test_recovery_transaction_idempotent_v96.py
      - name: V9.7 recovery transaction reconciler gate
        run: python -m pytest -q tests/test_recovery_transaction_reconcile_v97.py
      - name: V9.8 recovery runtime supervisor gate
        run: python -m pytest -q tests/test_recovery_runtime_v98.py
      - name: V9.9 recovery runtime audit gate
        run: python -m pytest -q tests/test_recovery_runtime_audit_v99.py
