name: v75-merge-authorization

on:
  pull_request:

permissions:
  contents: read

jobs:
  merge-authorization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run V7.5 deterministic merge authorization tests
        run: python -m pytest -q tests/test_merge_gate_v75.py
      - name: Run V7.6 deterministic server policy tests
        run: python -m pytest -q tests/test_server_policy_v76.py
      - name: Attest live GitHub server ruleset
        env:
          RULESET_URL: https://api.github.com/repos/watt188/first/rulesets/22864994
        run: |
          python - <<'PY'
          import json, os
          from github_delivery.server_policy_v76 import fetch_and_validate
          result = fetch_and_validate(os.environ['RULESET_URL'])
          print(json.dumps(result, sort_keys=True))
          PY
