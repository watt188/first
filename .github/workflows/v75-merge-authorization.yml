name: v75-merge-authorization

on:
  pull_request_target:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  merge-authorization:
    name: v75-merge-authorization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run protected merge-root tests from base branch
        run: python -m pytest -q tests/test_merge_gate_v75.py tests/test_server_policy_v76.py
      - name: Require all authoritative head workflows
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['HEAD_SHA']
          token = os.environ['GH_TOKEN']
          workflows = [
              'ci.yml', 'v6-production-baseline.yml', 'v61-real-provider.yml',
              'v62-provider-smoke.yml', 'v63-strict-provider.yml', 'v64-real-codegen.yml',
              'v65-multi-agent.yml', 'v66-pep-hardening.yml', 'v67-provider-resilience.yml',
              'v68-execution-isolation.yml', 'v69-evidence-integrity.yml',
              'v70-production-convergence.yml', 'v71-autonomous-delivery.yml',
              'v72-github-delivery-bridge.yml', 'v73-live-github-mutation.yml',
              'v74-provider-reliability.yml',
          ]
          pending = set(workflows)
          deadline = time.time() + 900
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + token,
              'X-GitHub-Api-Version': '2022-11-28',
          }
          while pending and time.time() < deadline:
              for workflow in list(pending):
                  base = f"https://api.github.com/repos/{repo}/actions/workflows/{urllib.parse.quote(workflow, safe='')}/runs"
                  query = urllib.parse.urlencode({'head_sha': head, 'event': 'pull_request', 'per_page': 10})
                  req = urllib.request.Request(base + '?' + query, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      payload = json.loads(resp.read().decode('utf-8'))
                  runs = [r for r in payload.get('workflow_runs', []) if r.get('head_sha') == head]
                  if not runs:
                      continue
                  run = sorted(runs, key=lambda r: (r.get('run_attempt', 1), r.get('created_at', '')), reverse=True)[0]
                  if run.get('status') != 'completed':
                      continue
                  if run.get('conclusion') != 'success':
                      raise SystemExit(f"authoritative_workflow_failed:{workflow}:{run.get('conclusion')}")
                  print(json.dumps({'workflow': workflow, 'run_id': run.get('id'), 'conclusion': 'success'}))
                  pending.remove(workflow)
              if pending:
                  time.sleep(5)
          if pending:
              raise SystemExit('authoritative_workflow_timeout:' + ','.join(sorted(pending)))
          PY
      - name: Capture live GitHub server policy evidence
        env:
          RULESET_URL: https://api.github.com/repos/watt188/first/rulesets/22864994
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          from github_delivery.server_policy_v76 import fetch_and_validate
          result = fetch_and_validate(os.environ['RULESET_URL'])
          result['head_sha'] = os.environ['HEAD_SHA']
          result['trusted_trigger'] = 'pull_request_target'
          result['authoritative_workflows'] = 16
          Path('artifacts/v80-trusted-merge-root.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Attest trusted merge-root evidence
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/v80-trusted-merge-root.json
      - name: Verify trusted merge-root provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/v80-trusted-merge-root.json --repo "$GITHUB_REPOSITORY"
      - name: Upload trusted merge-root evidence
        uses: actions/upload-artifact@v4
        with:
          name: v80-trusted-merge-root-evidence
          path: artifacts/v80-trusted-merge-root.json
