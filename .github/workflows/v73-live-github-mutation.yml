name: v73-live-github-mutation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-github-mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run V7.3 deterministic receipt tests
        run: python -m pytest -q tests/test_live_github_v73.py
      - name: Validate live pull request event
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          from github_delivery.live_v73 import receipt_from_event
          payload = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          receipt = receipt_from_event(payload)
          Path('artifacts/v73-live-github-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - name: Seal live mutation receipt
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m evidence_integrity.v69 seal --manifest artifacts/v73-live-manifest.json artifacts/v73-live-github-receipt.json
      - name: Verify live mutation receipt
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m evidence_integrity.v69 verify --manifest artifacts/v73-live-manifest.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: v73-live-github-mutation-evidence
          path: |
            artifacts/v73-live-github-receipt.json
            artifacts/v73-live-manifest.json
