name: v68-execution-isolation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  execution-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run V6.8 isolation tests
        run: python -m pytest -q tests/test_execution_isolation_v68.py
