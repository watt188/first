name: v72-github-delivery-bridge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-delivery-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run V7.2 deterministic bridge contract
        run: python -m pytest -q tests/test_github_delivery_v72.py
